name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialize: two merges landing together must not race to cut a release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The tag was verified on the PR that produced it, but re-check it here: this is the
  # last gate before the Marketplace, and it is the first time the release commit itself
  # is tested as a unit.
  verify:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: xvfb-run -a npm run test:integration

  # Tags created by release-please use the workflow token, which cannot trigger another
  # workflow's `push` event — so publishing is called from here rather than left to fire
  # on the tag.
  publish:
    needs: [release-please, verify]
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    permissions:
      contents: write
